<div class="app-layout profile-layout">
  <aside class="sidebar">
    <nav aria-label="Nawigacja użytkownika">
      <a class="sidebar-nav-link" routerLink="/profile">Profil</a>
      <ul class="sidebar-subnav">
        <li><a class="sidebar-nav-link" routerLink="/profile/data" routerLinkActive="active" [attr.aria-current]="isDataPanel ? 'page' : null">Dane</a></li>
        <li><a class="sidebar-nav-link" routerLink="/profile/plan" routerLinkActive="active" [attr.aria-current]="!isDataPanel ? 'page' : null">Plan</a></li>
      </ul>
      <a class="sidebar-nav-link" routerLink="/dashboard">Wyszukiwania</a>
    </nav>
  </aside>
  <main class="workspace profile-content" [attr.aria-busy]="loading">
    <h1>{{ isDataPanel ? 'Dane' : 'Plan' }}</h1>
    <p *ngIf="loading" role="status">Wczytywanie...</p>
    <div *ngIf="error" role="alert" class="error">
      {{ error }} <button type="button" class="ghost-button" (click)="loadPlan()">Ponów</button>
    </div>
    <ng-container *ngIf="!loading && !error">
      <dl *ngIf="isDataPanel && profile">
        <dt>Imię i nazwisko</dt><dd>{{ profile.displayName || '-' }}</dd>
        <dt>Email</dt><dd>{{ profile.googleEmail }}</dd>
      </dl>
      <label class="admin-status" *ngIf="isDataPanel && profile && profile.isAdmin">
        <input type="checkbox" checked disabled>Administrator
      </label>
      <ng-container *ngIf="!isDataPanel">
      <ng-container *ngIf="plan; else noPlan">
        <p class="plan-name"><strong>{{ plan.code }}</strong></p>
        <div class="plan-description" [innerHTML]="plan.descriptionHtml"></div>
      </ng-container>
      <ng-template #noPlan>
        <p>Brak aktywnego planu.</p>
        <a routerLink="/plans">Wybierz plan</a>
      </ng-template>
      </ng-container>
    </ng-container>
  </main>
</div>
