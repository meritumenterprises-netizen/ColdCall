<header class="topbar">
  <a class="logo" routerLink="/">FindMeNow</a>
  <nav *ngIf="showAuthenticatedMenu()">
    <a *ngIf="!api.isAdmin()" routerLink="/plans" routerLinkActive="active">Plany</a>
    <a *ngIf="api.isAdmin()" routerLink="/admin" routerLinkActive="active">Admin</a>
    <div class="user-menu" *ngIf="api.user()">
      <button #userMenuButton type="button" class="user-chip" [attr.aria-expanded]="userMenuOpen" aria-controls="user-menu-links"
              (click)="userMenuOpen = !userMenuOpen">
        <img *ngIf="avatarUrl" [src]="avatarUrl" referrerpolicy="no-referrer" (error)="avatarFailed()" alt="">
        <span *ngIf="!avatarUrl" class="avatar-fallback" aria-hidden="true">{{ avatarInitials }}</span>
        <span>{{ api.user()?.displayName || api.user()?.googleEmail }}</span>
        <span aria-hidden="true">&#9662;</span>
      </button>
      <div id="user-menu-links" class="user-menu-links" *ngIf="userMenuOpen">
        <a routerLink="/profile" (click)="userMenuOpen = false">Profil</a>
      </div>
    </div>
    <button type="button" (click)="logout()">Wyloguj</button>
  </nav>
</header>
