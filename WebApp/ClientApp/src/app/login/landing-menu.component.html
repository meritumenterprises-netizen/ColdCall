<header class="landing-header" [class.embedded]="embedded">
  <div *ngIf="!embedded && showBrand" class="brand-with-version"><a routerLink="/" class="landing-brand"><img class="brand-logo-image" src="assets/findmyclient-logo.png" width="200" height="60" alt="FindMyClient"></a><app-version-badge></app-version-badge></div>
  <nav aria-label="Menu strony" [class.user-navigation]="api.isNonAdmin()">
    <a *ngIf="!api.isAuthenticated()" routerLink="/" class="menu-trigger" (click)="contactOpen = false">Strona g&#322;&#243;wna</a>
    <div *ngIf="!api.isAuthenticated()" class="guides-menu">
      <button #guidesButton type="button" class="menu-trigger" [attr.aria-expanded]="guidesOpen"
              aria-controls="landing-guide-options" (click)="toggleGuides()">Poradniki <span aria-hidden="true">&#9662;</span></button>
      <div *ngIf="guidesOpen" id="landing-guide-options" class="contact-options guides-options">
        <a *ngFor="let guide of guides" [routerLink]="guide.path" (click)="closeMenus()">{{ guide.label }}</a>
      </div>
    </div>
    <a *ngIf="!api.user() || !api.user().disablePlanPurchase" [routerLink]="api.isNonAdmin() ? '/plans' : '/plany'" class="menu-trigger plans-menu-link" (click)="contactOpen = false">Plany</a>
    <div class="contact-menu">
      <button #contactButton type="button" class="menu-trigger" [attr.aria-expanded]="contactOpen"
              aria-controls="landing-contact-options" (click)="toggleContact()">Kontakt <span aria-hidden="true">&#9662;</span></button>
      <div *ngIf="contactOpen" id="landing-contact-options" class="contact-options">
        <a routerLink="/kontakt/informacja" (click)="contactOpen = false">Feedback</a>
        <a routerLink="/kontakt/wsparcie-techniczne" (click)="contactOpen = false">Wsparcie techniczne</a>
        <a routerLink="/kontakt/rodo" (click)="contactOpen = false">RODO</a>
        <a routerLink="/regulamin" (click)="contactOpen = false">Regulamin</a>
      </div>
    </div>
    <a routerLink="/wersja" class="menu-trigger" (click)="contactOpen = false">Aplikacja</a>
  </nav>
</header>
