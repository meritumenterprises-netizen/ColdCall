<main class="workspace plans-page">
  <header class="workspace-head">
    <div>
      <span class="eyebrow">Miesieczny dostep</span>
      <h1>Wybierz plan</h1>
    </div>
    <button *ngIf="canReturnToDashboard" class="ghost-button" routerLink="/dashboard">Wróć</button>
  </header>

  <div class="error" *ngIf="error">{{ error }}</div>

  <section class="plan-grid">
    <article class="plan-card" *ngFor="let plan of plans">
      <h2 class="plan-title">{{ plan.code | uppercase }}</h2>
      <div class="active-plan-status" *ngIf="plan.activeUntil">
        <span class="active-plan-badge">aktywny plan</span>
        <small>aktywny do {{ plan.activeUntil | date:'dd.MM.yyyy HH:mm' }}</small>
      </div>
      <div class="plan-description" [innerHTML]="plan.descriptionHtml"></div>
      <div *ngIf="!plan.activeUntil" class="price">{{ plan.price | number:'1.0-0' }} {{ plan.currency }}</div>
      <button *ngIf="!plan.activeUntil" class="primary-button" [disabled]="!plan.canPurchase" (click)="buy(plan)">Kup</button>
    </article>
  </section>
</main>
