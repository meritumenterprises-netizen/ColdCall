<main class="workspace plans-page">
  <header class="workspace-head">
    <div>
      <span class="eyebrow">Miesieczny dostep</span>
      <h1>Wybierz plan</h1>
    </div>
    <button class="ghost-button" routerLink="/dashboard">Wróć</button>
  </header>

  <div class="error" *ngIf="error">{{ error }}</div>

  <section class="plan-grid">
    <article class="plan-card" *ngFor="let plan of plans">
      <div class="active-plan-badge" *ngIf="plan.activeUntil">* twój plan</div>
      <h2 class="plan-title">{{ plan.code | uppercase }}</h2>
      <div class="plan-description" [innerHTML]="plan.descriptionHtml"></div>
      <div class="price">{{ plan.price | number:'1.0-0' }} {{ plan.currency }}</div>
      <small *ngIf="plan.activeUntil">Aktywny do {{ plan.activeUntil | date:'yyyy-MM-dd' }}</small>
      <button class="primary-button" [disabled]="!plan.canPurchase" (click)="buy(plan)">Kup</button>
    </article>
  </section>
</main>
