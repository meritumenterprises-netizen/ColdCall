<section class="login-shell">
  <div class="login-art">
    <div class="brand-mark">CC</div>
    <h1>ColdCall</h1>
    <p>Wyszukiwarka firm JDG i spolek z planami dostepu, PKD i panelem administracyjnym.</p>
  </div>

  <form class="login-card" (ngSubmit)="login()">
    <span class="eyebrow">Google Authentication</span>
    <h2>Zaloguj sie</h2>
    <label for="token">Google ID token</label>
    <textarea id="token" name="token" rows="6" [(ngModel)]="token" placeholder="Wklej token z Google Sign-In"></textarea>
    <p class="form-hint">Backend weryfikuje token przez issuer Google i skonfigurowany ClientId.</p>
    <button type="submit">Przejdz do aplikacji</button>
    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</section>
