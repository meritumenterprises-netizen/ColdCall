<section class="login-shell">
  <div class="login-art">
    <div class="brand-mark">CC</div>
    <h1>ColdCall</h1>
    <p>Self-hosted platforma B2B Sales Intelligence oparta na aktualnych danych rejestrowych CEIDG, KRS i REGON.</p>
  </div>

  <section class="login-card">
    <span class="eyebrow">Google Authentication</span>
    <h2>Zaloguj sie</h2>
    <p class="form-hint">Wybierz konto Google z listy, aby przejsc do aplikacji.</p>
    <p class="form-hint">Google OAuth origin: {{ currentOrigin }}</p>
    <div class="google-login-box">
      <div id="googleSignInButton"></div>
      <span *ngIf="isLoading && !error">Ladowanie Google...</span>
    </div>
    <div class="error" *ngIf="error">{{ error }}</div>
  </section>
</section>
